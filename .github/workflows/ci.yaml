name: CI

# Credential-free checks that run on every push and PR: lint and unit tests.
# The cloud-backed workflows (pr_checks, staging, deploy-to-prod) need the
# Workload Identity Federation setup from `agents-cli infra cicd`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra lint

      - name: Lint
        run: |
          uv run ruff check app tests submission_frontend
          uv run ruff format --check app tests submission_frontend

      - name: Unit tests
        run: uv run pytest tests/unit -q
